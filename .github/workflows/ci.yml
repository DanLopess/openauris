name: CI

on:
  push:
    branches-ignore: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build
        run: >-
          xcodebuild
          -project openauris.xcodeproj
          -scheme openauris
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Unit Tests
        run: >-
          xcodebuild
          -project openauris.xcodeproj
          -scheme openauris
          -destination 'platform=macOS'
          -only-testing:openaurisTests
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test
