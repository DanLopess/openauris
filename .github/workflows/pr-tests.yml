name: PR Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging]

jobs:
  test:
    name: Run Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Run Unit Tests
        run: >-
          xcodebuild
          -project openauris.xcodeproj
          -scheme OpenAuris
          -destination 'platform=macOS,arch=arm64'
          -only-testing:OpenAurisTests
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test

      - name: Run UI Tests
        run: >-
          xcodebuild
          -project openauris.xcodeproj
          -scheme OpenAuris
          -destination 'platform=macOS,arch=arm64'
          -only-testing:openaurisUITests
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test