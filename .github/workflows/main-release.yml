name: Main Branch Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build Release
        run: >-
          xcodebuild
          -project openauris.xcodeproj
          -scheme openauris
          -configuration Release
          -derivedDataPath build/DerivedData
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package .app as zip
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/openauris.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle missing at $APP_PATH"
            exit 1
          fi
          ZIP_NAME="openauris-v${{ github.run_number }}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: Automatic release created from push to main/master.
          files: ${{ env.ZIP_NAME }}
